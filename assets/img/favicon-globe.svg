<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    .globe-fav {
      transform-origin: 12px 12px;
      animation: favGlobePulse 3.2s ease-in-out infinite;
    }
    @keyframes favGlobePulse {
      0%, 100% { opacity: 0.7; transform: scale(0.93); }
      50%       { opacity: 1;   transform: scale(1); }
    }
  </style>
  <image class="globe-fav" href="data:image/png;base64," x="1" y="1" width="22" height="22"/>
</svg>