<!DOCTYPE html>
<html data-bs-theme="dark" class="scrollbar-hidden" lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Admin — B McCool</title>
    <link rel="canonical" href="https://doxxus.us/admin.html">
    <meta property="og:url" content="https://doxxus.us/admin.html">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Admin — B McCool">
    <meta property="og:image" content="https://doxxus.us/assets/img/doxxus-icon.png">
    <meta name="description" content="Admin hub for B McCool.">
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend+Giga:wght@100..900&display=block">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dongle:wght@300;400;700&display=swap">
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon-globe.svg">
    <link rel="alternate icon" type="image/png" sizes="32x32" href="assets/img/doxxus-icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/img/doxxus-icon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/typicons/2.0.9/typicons.min.css">
    <link rel="stylesheet" href="assets/css/bs-theme-overrides.css?v=20261010j">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    <link rel="stylesheet" href="assets/css/animate.css?v=20261010j">
    <link rel="stylesheet" href="assets/css/globe.css?v=20261010j">
    <link rel="stylesheet" href="assets/css/particle.compiled.css?v=20261010j">
    <link rel="stylesheet" href="assets/css/style.css?v=20261010j">
</head>

<body class="scrollbar-hidden ds-page" data-page="admin">

    <div class="cursor-outer"></div>
    <div class="cursor-inner"></div>

    <div data-site-nav></div>

    <main data-portal="admin">
        <!-- Start: particle -->
        <div id="particle" class="particle-animation-bg particle-div">
            <div id="particle-animation-wrapper-1" class="particle-animation-wrapper">
                <div id="particle-5" class="particle particle-1"></div>
                <div id="particle-6" class="particle particle-2"></div>
                <div id="particle-7" class="particle particle-4"></div>
                <div id="particle-8" class="particle particle-3"></div>
            </div>
        </div><!-- End: particle -->

        <header class="ds-page-hero">
            <div class="ds-shell">
                <span class="ds-eyebrow">Admin</span>
                <h1>Admin hub</h1>
                <p>Clients, projects, files and submissions.</p>
            </div>
        </header>

        <section class="ds-section ds-section--tight" data-admin-loading aria-busy="true" aria-label="Loading the admin hub">
            <div class="ds-shell ds-stack">
                <div class="sk sk-card portal-sk"></div>
                <div class="sk sk-card portal-sk"></div>
            </div>
        </section>

        <section class="ds-section ds-section--tight" data-admin-error hidden>
            <div class="ds-shell">
                <div class="ds-callout ds-callout--attention" role="alert">
                    <i class="typcn typcn-warning-outline" aria-hidden="true"></i>
                    <span>Could not load the admin hub. <button type="button" class="portal-link" data-admin-retry>Try again</button></span>
                </div>
            </div>
        </section>

        <section class="ds-section ds-section--tight" data-admin-denied hidden>
            <div class="ds-shell">
                <div class="ds-callout ds-callout--attention" role="alert">
                    <i class="typcn typcn-warning-outline" aria-hidden="true"></i>
                    <span class="portal-notice-body">
                        <span>This account is not an admin account. If you are a client, your projects are in your account.</span>
                        <span class="portal-row portal-row--start">
                            <a class="ds-btn ds-btn--sm" href="account.html">Go to my account</a>
                            <button type="button" class="ds-btn ds-btn--sm" data-admin-signout>Sign out</button>
                        </span>
                    </span>
                </div>
            </div>
        </section>

        <section class="ds-section ds-section--tight" data-admin-content hidden>
            <div class="ds-shell">
                <div class="ds-window" data-window data-window-start="expanded" data-tabs data-admin-tabs>
                    <div class="ds-window-bar">
                        <span class="ds-terminal-dots">
                            <button type="button" class="ds-dot ds-dot--close" data-terminal-action="close" aria-label="Reset this panel"></button>
                            <button type="button" class="ds-dot ds-dot--min" data-terminal-action="minimize" aria-expanded="true" aria-label="Show or hide this panel"></button>
                            <button type="button" class="ds-dot ds-dot--zoom" data-dot-inert tabindex="-1" aria-hidden="true"></button>
                        </span>
                        <button type="button" class="ds-window-title" data-admin-title>doxxus@admin &mdash; ~/clients</button>
                        <span class="ds-window-hint" data-admin-hint="clients"></span>
                    </div>
                    <div class="ds-window-body ds-window-body--plain">
                        <div class="portal-tabbar">
                            <div class="portal-tabs" role="tablist" aria-label="Admin sections">
                                <button type="button" role="tab" data-tab="clients">Clients</button>
                                <button type="button" role="tab" data-tab="submissions">Submissions</button>
                                <button type="button" role="tab" data-tab="account">Account</button>
                            </div>
                            <button type="button" class="portal-link portal-tabbar-action" data-admin-signout>Sign out</button>
                        </div>
                        <div class="ds-window-pad">
                            <section data-tab-panel="clients" hidden>
                                <div class="admin-list" data-admin-list>
                                    <div class="admin-side-tools">
                                        <div class="ds-field">
                                            <label for="admin-search">Find a client</label>
                                            <input class="ds-input" type="search" id="admin-search" data-admin-search placeholder="name, email, business" autocomplete="off">
                                        </div>
                                        <div class="admin-side-row">
                                            <label class="visually-hidden" for="admin-filter">Show</label>
                                            <select class="ds-input" id="admin-filter" data-admin-filter>
                                                <option value="all">All clients</option>
                                                <option value="active">Active</option>
                                                <option value="disabled">Disabled</option>
                                                <option value="it">IT support</option>
                                            </select>
                                            <button type="button" class="ds-btn ds-btn--sm ds-btn--primary" data-admin-new>New client</button>
                                        </div>
                                    </div>
                                    <div data-admin-clients aria-live="polite"></div>
                                </div>
                            </section>
                            <section data-tab-panel="submissions" hidden>
                                <div class="portal-panel-head"><h2 class="portal-panel-title">Submissions</h2><span class="portal-muted" data-admin-hint="submissions"></span></div>
                                <div data-admin-submissions aria-live="polite"></div>
                            </section>
                            <section data-tab-panel="account" hidden>
                                <div class="portal-panel-head"><h2 class="portal-panel-title">Account</h2></div>
                                <div data-admin-account aria-live="polite"></div>
                            </section>
                        </div>
                    </div>
                </div>

                <!-- Opens when a client is selected; the clients window above minimizes to its title bar. -->
                <div class="ds-window admin-client-window" id="new" data-window data-window-role="dialog" data-window-start="expanded" data-tabs data-admin-client-window hidden>
                    <div class="ds-window-bar">
                        <span class="ds-terminal-dots">
                            <button type="button" class="ds-dot ds-dot--close" data-terminal-action="close" aria-label="Close this client"></button>
                            <button type="button" class="ds-dot ds-dot--min" data-terminal-action="minimize" aria-expanded="true" aria-label="Show or hide this client"></button>
                            <button type="button" class="ds-dot ds-dot--zoom" data-dot-inert tabindex="-1" aria-hidden="true"></button>
                        </span>
                        <button type="button" class="ds-window-title" data-admin-client-title>doxxus@admin &mdash; ~/clients</button>
                        <span class="ds-window-hint admin-chips" data-admin-client-chips></span>
                    </div>
                    <div class="ds-window-body ds-window-body--plain">
                        <div class="portal-tabbar">
                            <div class="portal-tabs" role="tablist" aria-label="Client sections" data-admin-client-tablist>
                                <button type="button" role="tab" data-tab="projects">Projects</button>
                                <button type="button" role="tab" data-tab="files">Files &amp; links</button>
                                <button type="button" role="tab" data-tab="details">Details</button>
                                <button type="button" role="tab" data-tab="notes">Notes</button>
                            </div>
                            <span class="portal-tabbar-actions">
                                <a class="portal-link" href="account.html" data-admin-client-view>Client view</a>
                                <button type="button" class="portal-link" data-admin-client-close>Close</button>
                            </span>
                        </div>
                        <div class="ds-window-pad">
                            <section data-tab-panel="projects" hidden></section>
                            <section data-tab-panel="files" hidden></section>
                            <section data-tab-panel="details" hidden></section>
                            <section data-tab-panel="notes" hidden></section>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div data-site-footer></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <!-- plugins.js bundles Bootstrap 4 and Swiper; it must load before Bootstrap 5. -->
    <script src="assets/js/plugins.js?v=20261010j"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script src="assets/js/site-shell.js?v=20261013a"></script>
    <script src="assets/js/bs-init.js?v=20261010j"></script>
    <script src="assets/js/portfolio-data.js?v=20261010j"></script>
    <script src="assets/js/portfolio-carousel.js?v=20261010j"></script>
    <script src="assets/js/pages.js?v=20261010j"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
    <script src="assets/js/portal-ui.js?v=20261010j"></script>
    <script src="assets/js/portal.js?v=20261010j"></script>
    <script src="assets/js/admin-projects.js?v=20261010j"></script>
    <script src="assets/js/admin-files.js?v=20261010j"></script>
    <script src="assets/js/admin.js?v=20261010j"></script>
    <script src="assets/js/scripts.js?v=20261010j"></script>
    <script src="assets/js/glitch.js?v=20261010j"></script>
    <script src="assets/js/code-titles.js?v=20261010j"></script>
    <script src="assets/js/home.js?v=20261010j"></script>
    <script src="assets/js/router.js?v=20261013a"></script>
</body>

</html>
