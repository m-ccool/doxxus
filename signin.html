<!DOCTYPE html>
<html data-bs-theme="dark" class="scrollbar-hidden" lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Client Sign In — B McCool</title>
    <link rel="canonical" href="https://doxxus.us/signin.html">
    <meta property="og:url" content="https://doxxus.us/signin.html">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Client Sign In — B McCool">
    <meta property="og:image" content="https://doxxus.us/assets/img/doxxus-icon.png">
    <meta name="description" content="Client portal access for B McCool project clients.">
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend+Giga:wght@100..900&display=block">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dongle:wght@300;400;700&display=swap">
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon-globe.svg">
    <link rel="alternate icon" type="image/png" sizes="32x32" href="assets/img/doxxus-icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/img/doxxus-icon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/typicons/2.0.9/typicons.min.css">
    <link rel="stylesheet" href="assets/css/bs-theme-overrides.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    <link rel="stylesheet" href="assets/css/animate.css">
    <link rel="stylesheet" href="assets/css/globe.css">
    <link rel="stylesheet" href="assets/css/particle.compiled.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="scrollbar-hidden ds-page" data-page="signin">

    <div class="cursor-outer"></div>
    <div class="cursor-inner"></div>
    <div data-site-nav></div>

    <main>
        <!-- Start: particle -->
        <div id="particle" class="particle-animation-bg particle-div">
            <div id="particle-animation-wrapper-1" class="particle-animation-wrapper">
                <div id="particle-5" class="particle particle-1"></div>
                <div id="particle-6" class="particle particle-2"></div>
                <div id="particle-7" class="particle particle-4"></div>
                <div id="particle-8" class="particle particle-3"></div>
            </div>
        </div><!-- End: particle -->

        <div class="signin-wrap">
            <div class="ds-window signin-window" data-window data-window-start="expanded" data-portal="signin">
                <div class="ds-window-bar">
                    <span class="ds-terminal-dots">
                        <button type="button" class="ds-dot ds-dot--close" data-terminal-action="close" aria-label="Reset the sign-in panel"></button>
                        <button type="button" class="ds-dot ds-dot--min" data-terminal-action="minimize" aria-expanded="true" aria-label="Show or hide the sign-in panel"></button>
                        <button type="button" class="ds-dot ds-dot--zoom" data-terminal-action="zoom" aria-label="Expand this panel"></button>
                    </span>
                    <button type="button" class="ds-window-title" data-portal-title>doxxus@portal &mdash; ~/sign-in</button>
                    <span class="ds-window-hint">client area</span>
                </div>
                <div class="ds-window-body ds-window-body--plain">
                    <div class="ds-window-pad signin-body">

                        <div class="ds-callout ds-callout--note" data-portal-notice role="status" hidden>
                            <i class="typcn typcn-info-large" aria-hidden="true"></i>
                            <span data-portal-notice-text></span>
                        </div>

                        <div class="signin-head">
                            <span class="ds-eyebrow">Client portal</span>
                            <h1>Sign in</h1>
                            <p>Project status and billing for active clients.</p>
                        </div>

                        <button type="button" class="ds-btn ds-btn--primary ds-btn--lg portal-google" data-portal-google>
                            <svg class="portal-google-mark" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                            Continue with Google
                        </button>

                        <hr class="ds-divider">
                        <div class="signin-foot">
                            <p>No account yet? Accounts are created when a project starts. Sign in with the Google account for the email address you gave me.</p>
                            <a class="ds-btn" href="#contact" data-bs-toggle="modal" data-contact-type="other">Contact the dev</a>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <div data-site-footer></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <!-- plugins.js bundles Bootstrap 4 and Swiper; it must load before Bootstrap 5. -->
    <script src="assets/js/plugins.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script src="assets/js/site-shell.js"></script>
    <script src="assets/js/bs-init.js"></script>
    <script src="assets/js/portfolio-data.js"></script>
    <script src="assets/js/portfolio-carousel.js"></script>
    <script src="assets/js/pages.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
    <script src="assets/js/portal.js"></script>
    <script src="assets/js/scripts.js"></script>
    <script src="assets/js/glitch.js"></script>
    <script src="assets/js/code-titles.js"></script>
    <script src="assets/js/home.js"></script>
    <script src="assets/js/router.js"></script>
</body>

</html>
