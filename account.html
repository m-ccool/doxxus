<!DOCTYPE html>
<html data-bs-theme="dark" class="scrollbar-hidden" lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Your account — B McCool</title>
    <link rel="canonical" href="https://doxxus.us/account.html">
    <meta property="og:url" content="https://doxxus.us/account.html">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Your account — B McCool">
    <meta property="og:image" content="https://doxxus.us/assets/img/doxxus-icon.png">
    <meta name="description" content="Project status and billing for B McCool clients.">
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend+Giga:wght@100..900&display=block">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dongle:wght@300;400;700&display=swap">
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon-globe.svg">
    <link rel="alternate icon" type="image/png" sizes="32x32" href="assets/img/doxxus-icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/img/doxxus-icon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/typicons/2.0.9/typicons.min.css">
    <link rel="stylesheet" href="assets/css/bs-theme-overrides.css?v=20261010f">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    <link rel="stylesheet" href="assets/css/animate.css?v=20261010f">
    <link rel="stylesheet" href="assets/css/globe.css?v=20261010f">
    <link rel="stylesheet" href="assets/css/particle.compiled.css?v=20261010f">
    <link rel="stylesheet" href="assets/css/style.css?v=20261010f">
</head>

<body class="scrollbar-hidden ds-page" data-page="account">

    <div class="cursor-outer"></div>
    <div class="cursor-inner"></div>
    <div data-site-nav></div>

    <main data-portal="account">
        <!-- Start: particle -->
        <div id="particle" class="particle-animation-bg particle-div">
            <div id="particle-animation-wrapper-1" class="particle-animation-wrapper">
                <div id="particle-5" class="particle particle-1"></div>
                <div id="particle-6" class="particle particle-2"></div>
                <div id="particle-7" class="particle particle-4"></div>
                <div id="particle-8" class="particle particle-3"></div>
            </div>
        </div><!-- End: particle -->

        <header class="ds-page-hero">
            <div class="ds-shell">
                <span class="ds-eyebrow">Client portal</span>
                <h1>Your account</h1>
                <p data-account-lede>Status, files and billing for your projects.</p>
                <div class="portal-summary" data-account-summary hidden></div>
                <div class="tier-actions">
                    <a class="ds-btn ds-btn--primary ds-btn--lg" data-account-schedule role="link" aria-disabled="true" target="_blank" rel="noopener noreferrer">Schedule a call</a>
                    <button type="button" class="ds-btn ds-btn--lg" data-bs-toggle="modal" data-bs-target="#contact" data-contact-type="other" data-contact-prefill>Contact</button>
                </div>
                <p class="portal-hint" data-account-schedule-hint>No call scheduled yet. Contact the dev.</p>
            </div>
        </header>

        <section class="ds-section ds-section--tight" data-account-loading aria-busy="true" aria-label="Loading your account">
            <div class="ds-shell ds-stack">
                <div class="sk sk-card portal-sk"></div>
                <div class="sk sk-card portal-sk"></div>
            </div>
        </section>

        <section class="ds-section ds-section--tight" data-account-error hidden>
            <div class="ds-shell">
                <div class="ds-callout ds-callout--attention" role="alert">
                    <i class="typcn typcn-warning-outline" aria-hidden="true"></i>
                    <span>Could not load your account. <button type="button" class="portal-link" data-account-retry>Try again</button></span>
                </div>
            </div>
        </section>

        <section class="ds-section ds-section--tight" data-account-unlinked hidden>
            <div class="ds-shell">
                <div class="ds-callout ds-callout--attention" role="alert">
                    <i class="typcn typcn-warning-outline" aria-hidden="true"></i>
                    <span class="portal-notice-body">
                        <span>This account (<strong data-account-unlinked-email></strong>) is not linked to an active client account. Sign in with the email address you gave me, or contact me.</span>
                        <span class="portal-row portal-row--start">
                            <button type="button" class="ds-btn ds-btn--sm" data-bs-toggle="modal" data-bs-target="#contact" data-contact-type="other">Contact the dev</button>
                            <button type="button" class="ds-btn ds-btn--sm" data-account-signout>Sign out</button>
                        </span>
                    </span>
                </div>
            </div>
        </section>

        <section class="ds-section ds-section--tight" data-account-content hidden>
            <div class="ds-shell">
                <div class="ds-window" data-window data-window-start="expanded" data-tabs>
                    <div class="ds-window-bar">
                        <span class="ds-terminal-dots">
                            <button type="button" class="ds-dot ds-dot--close" data-terminal-action="close" aria-label="Reset this panel"></button>
                            <button type="button" class="ds-dot ds-dot--min" data-terminal-action="minimize" aria-expanded="true" aria-label="Show or hide this panel"></button>
                            <button type="button" class="ds-dot ds-dot--zoom" data-dot-inert tabindex="-1" aria-hidden="true"></button>
                        </span>
                        <button type="button" class="ds-window-title" data-account-title>doxxus@portal &mdash; ~/overview</button>
                        <span class="ds-window-hint" data-account-hint></span>
                    </div>
                    <div class="ds-window-body ds-window-body--plain">
                        <div class="portal-tabs" role="tablist" aria-label="Account sections">
                            <button type="button" role="tab" data-tab="overview">Overview</button>
                            <button type="button" role="tab" data-tab="project">Project</button>
                            <button type="button" role="tab" data-tab="files">Files &amp; links</button>
                            <button type="button" role="tab" data-tab="account">Account</button>
                        </div>
                        <div class="ds-window-pad">
                            <section data-tab-panel="overview" hidden></section>
                            <section data-tab-panel="project" hidden></section>
                            <section data-tab-panel="files" hidden></section>
                            <section data-tab-panel="account" hidden></section>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div data-site-footer></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <!-- plugins.js bundles Bootstrap 4 and Swiper; it must load before Bootstrap 5. -->
    <script src="assets/js/plugins.js?v=20261010f"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script src="assets/js/site-shell.js?v=20261010f"></script>
    <script src="assets/js/bs-init.js?v=20261010f"></script>
    <script src="assets/js/portfolio-data.js?v=20261010f"></script>
    <script src="assets/js/portfolio-carousel.js?v=20261010f"></script>
    <script src="assets/js/pages.js?v=20261010f"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
    <script src="assets/js/portal-ui.js?v=20261010f"></script>
    <script src="assets/js/portal.js?v=20261010f"></script>
    <script src="assets/js/account.js?v=20261010f"></script>
    <script src="assets/js/scripts.js?v=20261010f"></script>
    <script src="assets/js/glitch.js?v=20261010f"></script>
    <script src="assets/js/code-titles.js?v=20261010f"></script>
    <script src="assets/js/home.js?v=20261010f"></script>
    <script src="assets/js/router.js?v=20261010f"></script>
</body>

</html>
